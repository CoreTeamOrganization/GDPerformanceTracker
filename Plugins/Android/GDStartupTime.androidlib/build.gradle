apply plugin: 'com.android.library'

android {
    namespace "com.gamedistrict.perftracker"
    compileSdk 34
    // Without this AGP defaults to its own build-tools (e.g. 35.0.0), which Unity's bundled
    // SDK may not ship -> "licences have not been accepted". Reuse whatever unityLibrary resolved.
    buildToolsVersion = parent.android.buildToolsVersion

    defaultConfig {
        minSdk 21
        consumerProguardFiles 'proguard.txt'
    }

    // Root layout (not src/main) so Unity 2022.3 and Unity 6 both find the manifest.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
        }
    }

    lint { abortOnError false }
}
